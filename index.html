<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stüdyo Defteri</title>
<meta name="description" content="Endüstriyel tasarım projeleri için eskiz, araştırma ve planlama defteri.">
<meta name="theme-color" content="#ECEEEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131617" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stüdyo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-table app shell — project rail on the left, title-block cards, full-screen A4 sketch board. */
:root{
  --bg:#ECEEEC; --surface:#F6F7F5; --raised:#FFFFFF; --ink:#1B1F21; --ink-2:#4F575B; --ink-3:#848C90;
  --line:#D5D9D6; --line-2:#C3C8C5; --accent:#E0530C; --accent-ink:#FFFFFF; --accent-soft:#FBE5D8;
  --blue:#2B63C6; --ok:#2F8A55; --warn:#B9740B; --danger:#C3372B; --board:#D9DCDA; --paper:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,35,.06),0 6px 20px rgba(20,30,35,.06);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131617; --surface:#1A1E1F; --raised:#212627; --ink:#E7EAE8; --ink-2:#A8AFB1; --ink-3:#737B7E;
  --line:#2C3234; --line-2:#3A4143; --accent:#F26A24; --accent-ink:#1A0E06; --accent-soft:#3A2214;
  --blue:#6E9BEA; --ok:#5DBA83; --warn:#E0A445; --danger:#EC6A5E; --board:#0E1011; --paper:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131617; --surface:#1A1E1F; --raised:#212627; --ink:#E7EAE8; --ink-2:#A8AFB1; --ink-3:#737B7E;
  --line:#2C3234; --line-2:#3A4143; --accent:#F26A24; --accent-ink:#1A0E06; --accent-soft:#3A2214;
  --blue:#6E9BEA; --ok:#5DBA83; --warn:#E0A445; --danger:#EC6A5E; --board:#0E1011; --paper:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono)}
.eyebrow{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:20px 14px 16px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;position:relative;flex:none}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;background:var(--accent)}
.brand-mark::before{left:50%;top:-5px;bottom:-5px;width:2px;transform:translateX(-50%)}
.brand-mark::after{top:50%;left:-5px;right:-5px;height:2px;transform:translateY(-50%)}
.brand-name{font:700 16px/1 var(--f-display);font-stretch:118%}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--ink-2)}
.nav-btn:hover{background:var(--raised);color:var(--ink)}
.nav-btn[aria-current="true"]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav-btn .dot{width:10px;height:10px;border-radius:3px;flex:none}
.nav-btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-sec{display:flex;flex-direction:column;gap:2px}
.side-sec .eyebrow{padding:0 10px 6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.sync{display:flex;align-items:center;gap:8px;font:12px/1.3 var(--f-mono);color:var(--ink-3)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sync.local i{background:var(--warn)}

.main{overflow:auto;min-width:0;min-height:0;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 72px;padding-left:max(clamp(16px,3vw,36px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,36px),env(safe-area-inset-right,0px))}
.topbar{display:none;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scrim{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--raised);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--raised);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.icon{width:38px;padding:0}
.btn.sm.icon{width:30px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.4;cursor:default}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.page-head h1{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.05;margin-top:8px}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-head h2{font-size:18px;font-weight:650}

/* Project cards as drawing title blocks */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;text-align:left;border:1.5px solid var(--ink);background:var(--raised);border-radius:4px;padding:0;overflow:hidden;min-width:0}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.pcard{transition:transform .15s,box-shadow .15s}
.pc-top{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 18px;border-bottom:1.5px solid var(--ink);min-height:96px}
.pc-sw{width:14px;height:14px;border-radius:3px;margin-top:5px;flex:none}
.pc-name{font:650 19px/1.2 var(--f-display);font-stretch:108%;overflow-wrap:anywhere}
.pc-brief{color:var(--ink-2);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tblock{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;margin:0}
.tblock>div{padding:7px 10px 8px;border-right:1px solid var(--line-2);min-width:0}
.tblock>div:last-child{border-right:0}
.tblock dt{font:500 9.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.tblock dd{margin:4px 0 0;font:500 13px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.new{border-style:dashed;border-color:var(--line-2);background:transparent;align-items:center;justify-content:center;min-height:150px;color:var(--ink-2);gap:8px}
.pcard.new:hover{border-color:var(--accent);color:var(--accent)}

.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font:500 11.5px/1 var(--f-mono);background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.late{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.pill.soon{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}

.tasklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--raised);overflow:hidden}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.task:last-child{border-bottom:0}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}
.chk{appearance:none;width:20px;height:20px;border:1.5px solid var(--ink-3);border-radius:5px;flex:none;display:grid;place-items:center;cursor:pointer;margin:0;background:transparent}
.chk:checked{background:var(--ink);border-color:var(--ink)}
.chk:checked::after{content:"";width:10px;height:5px;border:2px solid var(--bg);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tproj{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.tproj i{width:8px;height:8px;border-radius:2px;flex:none}
.empty-row{padding:18px;color:var(--ink-3);font-size:14px}

.empty{border:1.5px dashed var(--line-2);border-radius:12px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-size:22px}
.empty p{color:var(--ink-2);max-width:46ch;margin:0}
.empty .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}

/* Project page */
.proj-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start;margin-bottom:18px}
.ph-main{min-width:0}
.ph-acts{display:flex;gap:2px;padding-top:8px}
.pmeta-line{border:0;background:transparent;padding:2px 0;color:var(--ink-2);font-size:14px;text-align:left}
.pmeta-line u{text-decoration:none;color:var(--ink-3);border-bottom:1px dashed var(--line-2)}
.pmeta-line:hover u{color:var(--accent);border-color:var(--accent)}
#pinfo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px}
#pinfo[hidden]{display:none}
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-h h2{font-size:18px;font-weight:650;flex:1}
.brief-card .brief{background:var(--surface);min-height:120px}
.brief-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.due-inline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.plan-hint{display:flex;gap:14px;align-items:flex-start;margin-top:16px;padding:16px 18px;border:1.5px dashed var(--line-2);border-radius:12px;color:var(--ink-2)}
.plan-hint>svg{width:22px;height:22px;color:var(--accent);flex:none;margin-top:2px}
.plan-hint b{color:var(--ink)}
.plan-hint p{margin:4px 0 0;font-size:14px;max-width:70ch}
.spin{width:20px;height:20px;border:2.5px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;flex:none;margin-top:2px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tl{position:relative;display:flex;gap:3px;margin:6px 0 4px;padding-top:18px}
.tl-seg{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.tl-seg b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-seg span{font:11px/1.2 var(--f-mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-seg.cur{background:var(--accent-soft);border-color:var(--accent)}
.tl-now{position:absolute;top:2px;height:16px;width:2px;background:var(--ink);transform:translateX(-1px);border-radius:1px}
.tl-now::after{content:"";position:absolute;left:-3px;bottom:-4px;border:4px solid transparent;border-top-color:var(--ink)}
.tl-now em{position:absolute;top:0;left:6px;font:600 10px/1 var(--f-mono);font-style:normal;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.tl-now.r em{left:auto;right:6px}
.plan-status{margin:12px 0 6px;font-size:14px}
.plan-st.warn{color:var(--warn)}
.plan-st.ok{color:var(--ok)}
.linkbtn{border:0;background:transparent;padding:0;color:var(--accent);font-weight:500;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.plan-goals{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.plan-goals li{border-left:2px solid var(--line-2);padding:2px 0 2px 10px}
.plan-goals li.cur{border-left-color:var(--accent)}
.plan-goals b{font-size:14px;font-weight:600;margin-right:6px}
.plan-goals span{font:11.5px/1 var(--f-mono);color:var(--ink-3)}
.plan-goals p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}
.plan-risk{margin-top:14px;font-size:14px;color:var(--ink-2)}
.plan-risk summary{cursor:pointer;color:var(--ink);font-weight:500}
.plan-risk ul{margin:6px 0 0;padding-left:20px}
.plan-draft{margin-top:16px;border-color:var(--accent);box-shadow:var(--shadow)}
.plan-sum{margin:0 0 12px;font-size:14.5px;color:var(--ink-2);max-width:72ch}
.pd-h{display:flex;align-items:baseline;gap:10px;font-size:15px;margin:20px 0 8px}
.pd-h span{font:400 12px/1 var(--f-mono);color:var(--ink-3)}
.pd-tasks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pd-tasks li{border-bottom:1px solid var(--line)}
.pd-tasks li:last-child{border-bottom:0}
.pd-tasks label{display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer}
.pd-tasks .t{flex:1;min-width:0}
.pd-tasks small,.t-st{font:11px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.pd-tasks label:has(.chk:not(:checked)) .t{color:var(--ink-3);text-decoration:line-through}
.pd-opt{display:flex;gap:12px;align-items:flex-start;margin-top:12px;cursor:pointer;font-size:14px}
.pd-opt .chk{margin-top:1px}
.pd-opt small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.pd-risk{margin-top:14px;font-size:13.5px;color:var(--ink-2);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:8px;padding:10px 12px}
.pd-risk ul{margin:4px 0 0;padding-left:18px}
.pd-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.t-grp{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.t-grp .linkbtn{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
.t-st{margin-left:8px}
.t-ms{color:var(--accent);margin-right:6px;font-size:12px}
.tl-ms{position:absolute;bottom:-5px;width:10px;height:10px;background:var(--accent);border:2px solid var(--bg);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.ms-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ms-list li{display:flex;align-items:baseline;gap:10px;font-size:14px}
.ms-list li i{width:8px;height:8px;background:var(--accent);transform:rotate(45deg);border-radius:1px;flex:none;align-self:center}
.ms-list li b{font-weight:600;flex:1;min-width:0}
.ms-list li span{font:12px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.ms-list li.past{opacity:.5}
.grades{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:16px}
.grades .eyebrow{margin-right:4px}
.grade{display:inline-flex;gap:6px;align-items:baseline;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.grade b{font:600 12px/1 var(--f-mono);color:var(--ink)}
.next-ms{display:flex;align-items:center;gap:12px;background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:12px}
.next-ms>i{width:12px;height:12px;background:var(--accent);transform:rotate(45deg);border-radius:2px;flex:none}
.next-ms>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.next-ms>div b{font-size:15px;font-weight:600}
.next-ms strong{font:700 22px/1 var(--f-display);text-align:right;white-space:nowrap}
.next-ms strong small{display:block;font:500 11px/1.4 var(--f-mono);color:var(--ink-3)}
.cl-bar{height:4px;border-radius:2px;background:var(--line);margin:-4px 0 12px;overflow:hidden}
.cl-bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.pd-due{margin:0 0 12px;font-size:14px;color:var(--ink-2);background:var(--surface);border-radius:8px;padding:8px 12px}
.due-inline .ai-note{font-size:12px}
.banner.preview{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft);color:var(--ink)}
.cal-card{margin-bottom:14px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.cal-card .card-h{width:100%;margin:0}
.cal-opts{display:flex;flex-direction:column;gap:2px;width:100%}
.cal-opts .pd-opt{margin-top:6px}
.cal-steps{margin:0;padding-left:20px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.cal-steps b{color:var(--ink);font-weight:600}
#calPanel[hidden]{display:none}
@media (max-width:700px){.tl-seg{padding:6px 5px}.tl-seg b{font-size:11px}.tl-seg span{display:none}.ph-acts span{display:none}.card{padding:14px}}
.t-del{opacity:.45}
.task:hover .t-del,.t-del:focus-visible{opacity:1}
.ptitle{font:700 clamp(26px,4vw,38px)/1.1 var(--f-display);font-stretch:112%;border:0;background:transparent;padding:4px 0;width:100%;border-bottom:1.5px solid transparent;border-radius:0;min-width:0}
.ptitle:hover{border-bottom-color:var(--line-2)}
.ptitle:focus{outline:0;border-bottom-color:var(--accent)}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;grid-column:1/-1}
.field{display:flex;align-items:center;gap:8px}
.field label{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.inp{height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--raised);padding:0 10px;min-width:0}
.inp:focus{outline:0;border-color:var(--accent)}
.swatches{display:flex;gap:6px}
.swatch{width:22px;height:22px;border-radius:6px;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.brief{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;line-height:1.5}
.brief:focus{outline:0;border-color:var(--accent);background:var(--raised)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;padding:10px 14px 12px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font:500 11px/1 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}

/* Sketch grid */
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.sk{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0}
.sk-open{border:0;padding:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:8px}
.sk-thumb{aspect-ratio:297/210;max-width:100%;width:100%;background:var(--paper);border:1px solid var(--line-2);border-radius:4px;overflow:hidden;display:block;object-fit:cover;box-shadow:var(--shadow)}
.sk-open:hover .sk-thumb{border-color:var(--ink-3)}
.sk-cap{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sk-cap b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sk-cap span{font:11px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.sk-del{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .15s}
.sk:hover .sk-del,.sk-del.armed,.sk-del:focus-visible{opacity:1}
@media (hover:none){.sk-del{opacity:1}}
.sk-new svg,.pcard.new svg{width:26px;height:26px}
.sk-new{align-self:start;width:100%;aspect-ratio:297/210;max-width:100%;border:1.5px dashed var(--line-2);border-radius:4px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-2)}
.sk-new:hover{border-color:var(--accent);color:var(--accent)}
.sk-new small{font:11px/1 var(--f-mono);color:var(--ink-3)}

/* Research */
.research{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.notelist{display:flex;flex-direction:column;gap:4px;position:sticky;top:12px}
.note-btn{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid transparent;border-radius:8px;background:transparent;padding:9px 11px;min-width:0}
.note-btn:hover{background:var(--raised)}
.note-btn[aria-current="true"]{background:var(--raised);border-color:var(--line)}
.note-btn b{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-btn span{font:11px/1.2 var(--f-mono);color:var(--ink-3)}
.tpl{display:grid;grid-template-columns:1fr;gap:4px;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.tpl .eyebrow{padding:0 4px 4px}
.editor{background:var(--raised);border:1px solid var(--line);border-radius:12px;min-width:0;display:flex;flex-direction:column}
.ed-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-title{flex:1;min-width:160px;border:0;background:transparent;font:650 18px/1.3 var(--f-display);font-stretch:106%;padding:4px 2px}
.ed-title:focus{outline:0}
.ed-tools{display:flex;gap:2px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.tb{height:32px;min-width:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb:hover{background:var(--raised);color:var(--ink)}
.tb svg{width:17px;height:17px}
.tb.claude{color:var(--accent);margin-left:auto}
.tsep{width:1px;background:var(--line);margin:6px 4px}
.doc{min-height:420px;padding:22px clamp(16px,4vw,40px) 48px;outline:0;line-height:1.65;max-width:76ch;width:100%;overflow-wrap:anywhere}
.doc:empty::before{content:attr(data-ph);color:var(--ink-3)}
.doc h1{font-size:26px;margin:.6em 0 .3em}
.doc h2{font-size:19px;margin:1.2em 0 .3em;padding-bottom:4px;border-bottom:1px solid var(--line)}
.doc h3{font-size:16px;margin:1em 0 .2em}
.doc p{margin:.4em 0}
.doc blockquote{margin:.8em 0;padding:4px 0 4px 14px;border-left:3px solid var(--accent);color:var(--ink-2)}
.doc img{display:block;max-width:100%;border-radius:6px;margin:.8em 0;border:1px solid var(--line)}
.doc ul,.doc ol{padding-left:1.4em}
.doc a{color:var(--blue)}
.ed-foot{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font:11.5px/1.3 var(--f-mono);color:var(--ink-3)}

.ai{border-top:1px solid var(--line);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-radius:0 0 12px 12px}
.ai-acts{display:flex;flex-wrap:wrap;gap:8px}
.ai-out{font-size:14px;line-height:1.6;max-height:420px;overflow:auto;overflow-wrap:anywhere}
.ai-out h4{font:650 14px/1.3 var(--f-display);margin:.9em 0 .2em}
.ai-out ul{margin:.2em 0;padding-left:1.2em}
.ai-out p{margin:.3em 0}
.ai-note{font:13px/1.45 var(--f-body);color:var(--ink-3)}

/* Board */
.board-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.drop{border:1.5px dashed var(--line-2);border-radius:10px;padding:14px 16px;color:var(--ink-3);font-size:13.5px;flex:1;min-width:220px}
.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.masonry{columns:4 220px;column-gap:14px}
.pin{break-inside:avoid;margin:0 0 14px;background:var(--raised);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.pin img{display:block;width:100%;height:auto;background:var(--surface);min-height:60px}
.pin-cap{display:flex;gap:6px;align-items:center;padding:6px 6px 6px 10px}
.pin-cap input{flex:1;min-width:0;border:0;background:transparent;font-size:13px;padding:4px 0;color:var(--ink-2)}
.pin-cap input:focus{outline:0;color:var(--ink)}
.uploading{font:12px/1.3 var(--f-mono);color:var(--ink-3)}

.addtask{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.addtask .inp{flex:1;min-width:180px}
.addtask input[type=date]{flex:0 0 auto}

/* Process board */
.pc-stage{display:flex;align-items:center;gap:3px;margin-bottom:6px}
.pc-stage i{width:14px;height:4px;border-radius:2px;background:var(--line-2)}
.pc-stage i.on{background:var(--accent)}
.pc-stage span{font:500 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-left:6px}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--raised)}
.step{border:0;border-right:1px solid var(--line-2);background:transparent;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;align-items:center;min-width:0}
.step:last-child{border-right:0}
.step:hover{background:var(--surface)}
.step-n{grid-row:1/3;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font:600 12px/1 var(--f-mono);color:var(--ink-3)}
.step-l{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-d{font:11px/1.2 var(--f-mono);color:var(--ink-3);min-height:13px}
.step.done .step-n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step.cur{background:var(--accent-soft)}
.step.cur .step-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.proc-help{margin:10px 0 18px}
.loose{margin-bottom:20px}
.loose-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pboard-wrap{overflow-x:auto;padding-bottom:8px;margin:0 -4px}
.pboard{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;padding:0 4px;min-width:min-content}
.pcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcol.cur{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.pcol.over{background:var(--accent-soft);border-color:var(--accent)}
.pcol header{display:flex;align-items:center;gap:8px}
.pcol-n{font:600 11px/1 var(--f-mono);color:var(--ink-3)}
.pcol header b{font:650 15px/1.2 var(--f-display);flex:1}
.pcol-c{font:11px/1 var(--f-mono);color:var(--ink-3)}
.pnote{width:100%;border:1px dashed var(--line-2);border-radius:8px;background:transparent;padding:7px 9px;font-size:13px;line-height:1.45;resize:vertical;min-height:40px}
.pnote:focus{outline:0;border-style:solid;border-color:var(--accent);background:var(--raised)}
.pcards{display:flex;flex-direction:column;gap:8px}
.pcol-empty{font-size:12.5px;color:var(--ink-3);padding:10px 4px;text-align:center}
.prc{background:var(--raised);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0;cursor:grab}
.prc.dragging{opacity:.4}
.prc-open{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.prc-open img{display:block;width:100%;aspect-ratio:297/210;object-fit:cover;background:#fff;border-bottom:1px solid var(--line)}
.prc-k{font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:8px 10px 0}
.prc-open b{font-size:13.5px;font-weight:600;padding:0 10px;overflow-wrap:anywhere}
.prc-sub{font-size:12px;color:var(--ink-2);padding:0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-sel{margin:6px 6px 8px;height:26px;border:0;border-radius:6px;background:transparent;font:11.5px/1 var(--f-mono);color:var(--ink-3);padding:0 4px;align-self:flex-start}
.pc-sel:hover,.pc-sel:focus{background:var(--surface);color:var(--ink)}
@media (max-width:700px){.stepper{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}.step{grid-template-columns:1fr;justify-items:center;text-align:center;padding:8px 4px}.step-n{grid-row:auto}.step-l{font-size:12px}}
/* concept matrix */
.mx-empty .row{flex-wrap:wrap}
.mx-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--raised);margin-top:10px;-webkit-overflow-scrolling:touch}
.mx{border-collapse:separate;border-spacing:0;min-width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:middle;text-align:left}
.mx thead th{vertical-align:bottom;background:var(--surface)}
.mx tbody tr:last-child th,.mx tbody tr:last-child td{border-bottom:0}
.mx-corner,.mx-crit,.mx tfoot th{position:sticky;left:0;z-index:1;background:var(--raised);border-right:1px solid var(--line);min-width:200px;width:220px}
.mx thead .mx-corner{background:var(--surface);font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.mx-corner span{display:block;color:var(--ink-3);opacity:.75}
.mx-con{min-width:178px}
.mx .win{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.mx thead .mx-con.win{background:var(--accent-soft);box-shadow:inset 0 3px 0 var(--accent)}
.mx-th{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;margin-bottom:8px}
.mx-th img{display:block;width:100%;aspect-ratio:297/210;object-fit:cover}
.mx-name{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:5px 6px;font:600 14px/1.3 var(--f-body);color:var(--ink)}
.mx-con .mx-name{font:650 15px/1.25 var(--f-display)}
.mx-name:hover{border-color:var(--line)}
.mx-name:focus{outline:0;border-color:var(--accent);background:var(--raised)}
.mx-ctl{display:flex;gap:4px;align-items:center;margin-top:4px}
.mx-sel{flex:1;min-width:0;height:28px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font-size:12px;padding:0 4px;color:var(--ink-2)}
.mx-w{font-family:var(--f-mono);letter-spacing:.02em}
.mx-x{flex:none;min-width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--ink-3);display:grid;place-items:center;padding:0 4px;font-size:12px}
.mx-x:hover{background:var(--surface);color:var(--danger)}
.mx-x svg{width:15px;height:15px}
.mx-dots{display:flex;align-items:center;gap:3px}
.mx-d{width:26px;height:30px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer}
.mx-d::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--raised);transition:transform .12s}
.mx-d.on::before{background:var(--ink);border-color:var(--ink)}
.win .mx-d.on::before{background:var(--accent);border-color:var(--accent)}
.mx-d:hover::before{transform:scale(1.18);border-color:var(--ink-2)}
.mx-d:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.mx-v{font:600 12px/1 var(--f-mono);color:var(--ink-3);margin-left:6px;min-width:10px}
.mx tfoot th,.mx tfoot td{border-top:1.5px solid var(--ink);border-bottom:0;background:var(--surface)}
.mx tfoot th{font:650 13px/1.2 var(--f-display)}
.mx tfoot td.win{background:var(--accent-soft)}
.mx-tot{display:flex;align-items:baseline;gap:3px}
.mx-tot b{font:700 24px/1 var(--f-display)}
.mx-tot span{font:12px/1 var(--f-mono);color:var(--ink-3)}
.mx-rank{margin-left:auto;font:600 10.5px/1 var(--f-mono);font-style:normal;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);border:1px solid var(--line-2);border-radius:99px;padding:3px 7px}
.win .mx-rank{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mx-bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.mx-bar i{display:block;height:100%;border-radius:2px;background:var(--ink-2)}
.win .mx-bar i{background:var(--accent)}
.mx-sum{margin:14px 0 0;font-size:14px;line-height:1.55;color:var(--ink-2);max-width:72ch}
.mx-sum b{color:var(--ink)}
.mx-miss{color:var(--warn)}
.mx-notebox{margin-top:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:720px}
.mx-notebox label{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
@media (max-width:700px){.mx-corner,.mx-crit,.mx tfoot th{min-width:150px;width:150px}.mx th,.mx td{padding:8px}.mx-d{width:24px}}
.pdfbox .pdf-grid{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 6px}
.pdfbox .pdf-fig{width:calc(33.3% - 8px);margin:0}
.pdfbox .pdf-fig img{width:100%;aspect-ratio:297/210;object-fit:cover;margin:0 0 4px}
.pdfbox .pdf-fig figcaption{font-size:11px;color:#4f575b}
/* Critiques */
.crit-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.critlist{display:flex;flex-direction:column;gap:12px}
.critform{background:var(--raised);border:1.5px solid var(--accent);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.cf-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.cf{display:flex;flex-direction:column;gap:5px;min-width:0}
.cf label{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.cf label .ai-note{text-transform:none;letter-spacing:0}
.cf .inp{width:100%}
.inp.ta{height:auto;padding:8px 10px;line-height:1.5;resize:vertical}
.cf-btns{display:flex;gap:8px}
.crit{background:var(--raised);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:4px 10px 10px 4px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.crit-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.crit-date{font:500 13px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.crit-by{color:var(--ink-2);font-size:13.5px}
.crit-course{margin-left:auto;font:600 13px/1.2 var(--f-display);color:var(--ink-2)}
.crit-proj{margin-left:auto;border:0;background:transparent;padding:2px 0;max-width:50%}
.crit-proj:hover{color:var(--accent)}
.crit-shown{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.crit-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.crit-acts{list-style:none;margin:2px 0 0;padding:8px 0 0;border-top:1px dashed var(--line-2);display:flex;flex-direction:column;gap:6px}
.crit-acts label{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.crit-acts li.done span{text-decoration:line-through;color:var(--ink-3)}
.crit-f{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--raised);font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chip span{font:11px/1 var(--f-mono);color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] span{color:inherit;opacity:.7}
/* Practice */
.streak{font-size:14px;color:var(--ink-2)}
.streak b{font:700 22px/1 var(--f-display);color:var(--accent);margin-right:4px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.excard{background:var(--raised);border:1.5px solid var(--ink);border-radius:4px;display:flex;flex-direction:column;min-width:0}
.ex-top{display:flex;justify-content:space-between;gap:10px;padding:16px 16px 12px;align-items:flex-start}
.ex-top h3{font-size:19px;font-weight:650}
.ex-top p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.ex-stats{border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line-2)}
.ex-chart{padding:12px 16px 4px;display:flex;flex-direction:column;gap:6px}
.excard>.btn{margin:10px 16px 16px}
.spark{width:100%;height:64px;display:block;overflow:visible}
.sp-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.sp-area{fill:var(--accent);opacity:.12}
.sp-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sp-end{fill:var(--accent);stroke:var(--raised);stroke-width:2}
.sp-hit{fill:transparent;cursor:default}
.sp-hit:hover{fill:var(--accent);fill-opacity:.18}
.spark-empty{height:64px;display:grid;place-items:center;color:var(--ink-3);font:12px var(--f-mono);border:1px dashed var(--line-2);border-radius:6px}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:72ch;color:var(--ink-2)}
.tips b{color:var(--ink)}
.pr .skx-stage{background:#fff}
.pr canvas{position:absolute;inset:0;width:100%;height:100%}
.pr-title{font:650 16px/1.2 var(--f-display);font-stretch:106%;flex:1}
.pr-round,.pr-avg{font-size:13px;color:var(--ink-2)}
.pr-hint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:13px/1.3 var(--f-mono);color:#5b6166;background:rgba(255,255,255,.9);padding:6px 12px;border-radius:8px;pointer-events:none;text-align:center;max-width:calc(100% - 32px)}
.pr-score{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#1b1f21;color:#fff;border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.pr-score b{font:700 30px/1 var(--f-display)}
.pr-score span{font-size:13.5px;line-height:1.35}
.pr-score.good b{color:#7ad19c}.pr-score.mid b{color:#f2c05a}.pr-score.low b{color:#ff8a7a}
.pr-score.pr-done{top:50%;transform:translate(-50%,-50%);flex-direction:column;text-align:center;padding:24px 28px;gap:8px}
.pr-score.pr-done b{font-size:56px;color:#fff}
.pr-score.pr-done .eyebrow{color:#a9b0b2}
.pr-btns{display:flex;gap:8px;margin-top:8px}
/* Off-screen print sheet for PDF export: always light paper */

const $ = (s, r = document) => r.querySelector(s);

const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const now = () => Date.now();
const debounce = (fn, ms) => { let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; d.flush = (...a) => { clearTimeout(t); return fn(...a); }; d.cancel = () => clearTimeout(t); return d; };
const COLORS = ["#E0530C", "#2B63C6", "#2F8A55", "#8A4FBF", "#C29A0E", "#1B1F21"];

/* Downloads: share sheet on iPhone/iPad (Save to Files / Add to Calendar), a normal download elsewhere. */
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const MIME = { ics: "text/calendar", pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", zip: "application/zip", json: "application/json", md: "text/markdown", txt: "text/plain", csv: "text/csv" };
const LocalDownloads = {
  async save({ filename, data }) {
    const ext = (filename.split(".").pop() || "").toLowerCase();
    const blob = data instanceof Blob ? data : new Blob([data]);
    const file = new File([blob], filename, { type: MIME[ext] || blob.type || "application/octet-stream" });
    if (IS_IOS && ext === "ics") { location.href = URL.createObjectURL(file); return { status: "saved" }; } // Safari opens the "Add to Calendar" sheet
    if (IS_IOS && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return { status: "saved" }; }
      catch (e) { if (e && e.name === "AbortError") throw { code: "declined" }; }
    }
    const u = URL.createObjectURL(file), a = document.createElement("a");
    a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60e3);
    return { status: "saved" };
  },
};
async function initStore() {
  DB = LocalDB; UID = "local"; MODE = "local"; ASSETS = LocalAssets; DOWNLOADS = LocalDownloads; SAMPLE = makeSample();
  try { await IDB.open(); } catch { IDB_OK = false; }
  await LocalDB.load();
  await LocalAssets.load();
}

function subscribeProjects() {
  let first = true;
  const timer = setTimeout(() => { if (first) { $("#view").innerHTML = `<div class="banner">Kayıtlara henüz ulaşılamadı. Bağlantını kontrol et; sayfa bağlanınca kendiliğinden yüklenecek.</div>`; } }, 10000);
  projCol().onSnapshot(snap => {
    if (first && snap.metadata && snap.metadata.fromCache === false) { clearTimeout(timer); }
    first = false;
    S.projects = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    S.ready = true;
    onProjects();
  }, err => { clearTimeout(timer); $("#view").innerHTML = `<div class="banner">Kayıtlar yüklenemedi (${esc(err.code)}). Sayfayı daha sonra yeniden aç.</div>`; });
}
function subscribeItems(pid) {
  if (S.itemsPid === pid) return;
  if (S.itemsUnsub) S.itemsUnsub();
  S.items = []; S.itemsPid = pid;
  S.itemsUnsub = itemsCol(pid).onSnapshot(snap => {
    S.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    onItems();
  }, () => {});
}

const PSTAGES = [["arastirma", "Araştırma"], ["konsept", "Konsept"], ["gelistirme", "Geliştirme"], ["maket", "Maket"], ["final", "Final"]];

function parseHash() {
  if (location.hash === "#kritikler") return { view: "crits" };
  if (location.hash === "#alistirma") return { view: "practice" };
  if (location.hash === "#ayarlar") return { view: "settings" };
  const m = location.hash.match(/^#p-([a-z0-9]+)(?:-(plan|surec|eskiz|matris|arastirma|pano|kritik|gorev))?$/);
  return m ? { view: "project", pid: m[1], tab: !m[2] || m[2] === "gorev" ? "plan" : m[2] } : { view: "home" };
}
function go(route, push = true) {
  S.route = route;
  const h = route.view === "project" ? `#p-${route.pid}-${route.tab}` : route.view === "crits" ? "#kritikler" : route.view === "practice" ? "#alistirma" : route.view === "settings" ? "#ayarlar" : "#home";
  if (push && location.hash !== h) history.replaceState(null, "", h);
  $("#app").classList.remove("nav-open");
  mountMain(); renderSide();
  $("#main").scrollTop = 0;
}
window.addEventListener("hashchange", () => { const r = parseHash(); if (r.view !== S.route.view || r.pid !== S.route.pid || r.tab !== S.route.tab) go(r, false); });

function onProjects() {
  renderSide();

  if (S.route.view === "crits") { if (!$("#critsPage")) mountMain(); return; }

  fillHeader(p); updateTabCounts();

function onItems() { if (S.route.view !== "project") return; updateTabCounts(); refreshTab(); syncCounts(); }
function mountMain() {
  if (!S.ready) return;

  if (S.route.view === "practice") { mountPractice(); return; }

function normLayers(it) {
  if (Array.isArray(it.layers) && it.layers.length) return it.layers.map(l => ({ id: l.id || rid(), name: l.name || "Katman", vis: l.vis !== false, op: typeof l.op === "number" ? l.op : 1, strokes: Array.isArray(l.strokes) ? l.strokes.slice() : [] }));
  return [{ id: rid(), name: "Katman 1", vis: true, op: 1, strokes: Array.isArray(it.strokes) ? it.strokes.slice() : [] }];
}
function defaultLayers() {
  return [{ id: rid(), name: "Kurgu", vis: true, op: .55, strokes: [] }, { id: rid(), name: "Ton", vis: true, op: 1, strokes: [] }, { id: rid(), name: "Çizim", vis: true, op: 1, strokes: [] }];
}
function quickThumb(s) {
  const layers = normLayers(s);
  if (s.bg || !layers.some(l => l.strokes.length)) return "";
  const cv = document.createElement("canvas"); cv.width = 420; cv.height = Math.round(420 * H / W);
  const c = cv.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, cv.width, cv.height); c.scale(cv.width / W, cv.height / H);
  layers.forEach(l => { if (l.vis) l.strokes.forEach(st => drawStroke(c, st, l.op)); });
  return cv.toDataURL("image/jpeg", .72);
}
async function newSketch() {

  const id = rid(); const n = itemsOf("sketch").length + 1;
  const doc = { kind: "sketch", phase: curStage(p), title: `Eskiz ${String(n).padStart(2, "0")}`, strokes: [], layers: defaultLayers(), active: 0, bg: null, guide: "dots", thumb: "", createdAt: now(), updatedAt: now() };

  openSketch(id);
}

}

}

function mdLite(s) {
  const lines = esc(s).split(/\r?\n/); let out = "", inList = false;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  for (const l of lines) {
    const li = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const hd = l.match(/^#{1,4}\s+(.*)/);
    if (hd) out += `<h4>${inline(hd[1])}</h4>`; else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  if (inList) out += "</ul>";
  return out;
}

- kilometre: brief'te tarihi verilmiş jüri, sunum, ara teslim ve final teslimleri, brief'teki tarihleriyle (geçmiş olanlar dahil). "t" kısa ve ne yapılacağını söylesin (ör. "Ön jüri: 3 konsept sun, birini seç"). Brief'te takvim yoksa boş bırak.
- asamalar: sırasıyla ${PSTAGES.slice(from).map(s => s[0]).join(", ")}. İlki bugün başlar, sonuncusu teslim günü biter; art arda ve boşluksuz. Brief'te takvim varsa aşama sınırlarını kilometre taşlarına ve haftalık konulara hizala (ör. konsept seçiminin yapıldığı ön jüri konsept aşamasının sonudur). Takvim yoksa maket ve final için yeterli süre bırak; son 1–2 günü pafta / sunum hazırlığına ayır. Gerekirse bir aşamayı 1 güne indirebilirsin. "hedef": o aşamanın çıktısı, en fazla 10 kelime.
- gorevler: 8–16 somut, yapılabilir görev (ör. "Marka kimliği prizması analizi", "30 küçük hızlı eskiz", "1:1 look-like model"). Her biri en fazla 8 kelime. Kilometre taşlarını burada tekrar etme; onlara hazırlık görevleri koy (ör. jüriden 1–2 gün önce "Ön jüri sunumunu hazırla"). Tarihleri aşamalarına yay, bir güne yığma.
- teslimler: brief'teki final teslim kalemlerinin kontrol listesi. Her kalem en fazla 12 kelime; alt maddeleri tek kalemde topla (ör. "Teknik çizimler: ölçülü görünüşler, kesit, detay, patlatma"). Süre / ölçek / format sınırlarını koru (ör. "en fazla 59 sn"). En fazla 10 kalem. Brief'te yoksa boş bırak.
- notlar: brief'te notlandırma tablosu varsa kalemleri ve yüzdeleri (ör. {"n":"Etkileşim tasarımı konsepti","yuzde":20}). Yoksa boş.
- sorular: araştırma aşamasında cevaplanacak 4–6 soru; brief bir yöntem ya da kaynak öneriyorsa (ör. bir model, kitap) ona dayandır.
- kriterler: konseptleri karşılaştırmak için brief'e özgü 4–6 kriter (en fazla 5 kelime). w: 3 = brief'in çekirdeği, 2 = önemli, 1 = artı. Notlandırma varsa ağırlıkları ona göre seç.
- riskler: en fazla 3 kısa madde. Brief'te belirsiz ya da eksik bir şey varsa (ölçü, kullanıcı, teslim formatı) "Hocaya sor: …" diye yaz.
- ozet: brief'i nasıl anladığını 1–2 cümleyle yaz.

Yalnızca şu biçimde JSON döndür, başka hiçbir metin yazma:
{"ozet":"","teslim":"YYYY-MM-DD","kilometre":[{"t":"","tarih":"YYYY-MM-DD"}],"asamalar":[{"k":"${PSTAGES[from][0]}","bas":"YYYY-MM-DD","bit":"YYYY-MM-DD","hedef":""}],"gorevler":[{"t":"","tarih":"YYYY-MM-DD","asama":"${PSTAGES[from][0]}"}],"teslimler":[""],"notlar":[{"n":"","yuzde":20}],"sorular":[""],"kriterler":[{"n":"","w":3}],"riskler":[""]}`;
  try {
    const r = await SAMPLE(prompt, { cache: false, modelTier: "default" });
    const m = r.text.match(/\{[\s\S]*\}/); if (!m) throw new Error("parse");
    const raw = JSON.parse(m[0]);
    const due = p.due || isoOK(raw.teslim);
    if (!due) { toast("Brief'te teslim tarihi bulunamadı. Tarihi girip tekrar dene."); return; }
    if (due <= todayISO()) { toast(`Brief'teki teslim tarihi (${fmtLong(due)}) geçmiş görünüyor. Yeni bir teslim tarihi girersen ona göre planlarım.`); togglePinfo(true); return; }
    const d = cleanPlan(raw, p, due);
    if (!d.asamalar.length || !d.gorevler.length) throw new Error("empty");

    { const m = aiErr(e, "Plan çıkarılamadı. Tekrar dene."); if (m) toast(m); }

}

  if (!d.noC && d.kriterler.length) { const m = mxOf(p), have = new Set(m.crit.map(c => (c.n || "").toLocaleLowerCase("tr"))); d.kriterler.forEach(c => { if (!have.has(c.n.toLocaleLowerCase("tr"))) m.crit.push({ id: rid(), n: c.n, w: c.w }); }); patch.matrix = m; }

    const id = rid(), doc = { kind: "note", phase: "arastirma", title: "Araştırma soruları", html: `<h2>Araştırma soruları</h2><p>Claude'un brief'ten çıkardığı sorular. Cevapları altlarına yaz.</p>${d.sorular.map(q => `<h3>${esc(q)}</h3><p><br></p>`).join("")}${d.riskler.length ? `<h2>Dikkat edilecekler</h2><ul>${d.riskler.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}`, createdAt: now(), updatedAt: now() };
    S.items.push({ id, ...doc }); itemDoc(p.id, id).set(doc).catch(() => toast("Soru belgesi oluşturulamadı."));

}
/* brief file → text */
const PDFJS = ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"];
async function pdfToText(file) {
  await loadScript(PDFJS[0]); await loadScript(PDFJS[1]);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS[1];
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;

  for (let i = 1; i <= n; i++) { const pg = await pdf.getPage(i); const tc = await pg.getTextContent(); out += tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("") + "\n\n"; }

}
async function pdfPagesToJpeg(pdf, max = 3) {

}
async function imagesToText(blobs) {

  if (!lim || !lim.images) throw { code: "no_images" };
  const r = await SAMPLE(`Ekteki görsel(ler) bir tasarım projesinin brief'i. İçindeki metni aslına sadık kalarak düz metne aktar (metin hangi dildeyse o dilde). Başlıkları ayrı satıra yaz, maddeler için "- " kullan. Yorum ya da açıklama ekleme. Okunamayan yere [okunamadı] yaz.`, { images: blobs.slice(0, Math.max(1, lim.images.maxCount || 3)), cache: false });

}
async function loadBriefFile(file) {
  const p = proj(); if (!p || !file) return;

    let text = "";
    if (/^text\/|\.(txt|md)$/i.test(file.type + " " + file.name)) text = (await file.text()).trim();
    else if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {

      if (text.replace(/\s/g, "").length < 40 && (SAMPLE || !text.trim())) { st("PDF taranmış görünüyor; Claude sayfaları okuyor…"); text = await imagesToText(await pdfPagesToJpeg(r.pdf)); }
    } else if (file.type.startsWith("image/")) { st("Claude fotoğraftaki metni okuyor…"); text = await imagesToText([await compressImage(file)]); }

const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");

const MX_DEF = [["Kullanıcı ihtiyacını karşılama", 3], ["Ergonomi / kullanım kolaylığı", 3], ["Üretilebilirlik", 2], ["Maliyet", 2], ["Özgünlük / estetik", 2], ["Sürdürülebilirlik", 1]];

function uniqName(set, name, ext = "") { let n = name, k = 2; while (set.has((n + ext).toLowerCase())) n = `${name} (${k++})`; set.add((n + ext).toLowerCase()); return n + ext; }

async function fetchAsset(id) {
  const url = assetUrl(id); if (!url) return null;
  try { const r = await fetch(url); if (!r.ok) throw 0; return await r.blob(); }
  catch { return await new Promise(res => { const img = new Image(); img.onload = async () => { const cv = document.createElement("canvas"); cv.width = img.naturalWidth; cv.height = img.naturalHeight; cv.getContext("2d").drawImage(img, 0, 0); res(await toBlob(cv)); }; img.onerror = () => res(null); img.src = url; }); }
}
const extOf = b => ({ "image/png": ".png", "image/jpeg": ".jpg", "image/webp": ".webp", "image/gif": ".gif" }[b && b.type] || ".png");

async function htmlToPdf(title, bodyHtml, meta) {
  await loadScript(CDN.h2c); await loadScript(CDN.jspdf);
  const PW = 794, PH = 1123, M = 64, CW = PW - 2 * M, CH = PH - 2 * M - 20;
  const box = document.createElement("div"); box.className = "pdfbox"; box.style.width = CW + "px";
  box.innerHTML = `<div class="pdf-head"><div class="pdf-meta">${esc(meta || "")}</div><h1 class="pdf-title">${esc(title)}</h1></div>${bodyHtml}`;
  document.body.appendChild(box);
  await Promise.all([...box.querySelectorAll("img")].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  try { await document.fonts.ready; } catch {}
  const scale = 2;
  let canvas;
  try { canvas = await window.html2canvas(box, { scale, backgroundColor: "#ffffff", useCORS: true, logging: false }); }
  finally { /* keep box until measured */ }
  const top0 = box.getBoundingClientRect().top, total = box.scrollHeight;
  const cands = [...new Set([...box.querySelectorAll("h1,h2,h3,p,li,blockquote,img,.pdf-block")].map(el => Math.floor(el.getBoundingClientRect().top - top0)))].filter(t => t > 0).sort((a, b) => a - b);
  box.remove();
  const pages = []; let y = 0;
  while (y < total - 1) {
    let end = y + CH;
    if (end >= total) { pages.push([y, total]); break; }
    const c = cands.filter(t => t > y + CH * .45 && t <= end).pop(); if (c) end = c;
    pages.push([y, end]); y = end;
  }
  const { jsPDF } = window.jspdf; const k = 0.75; // px → pt
  const pdf = new jsPDF({ unit: "pt", format: "a4" });
  pages.forEach(([a, b], i) => {
    if (i) pdf.addPage();
    const pc = document.createElement("canvas"); pc.width = canvas.width; pc.height = Math.max(1, Math.ceil((b - a) * scale));
    const g = pc.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, pc.width, pc.height); g.drawImage(canvas, 0, a * scale, canvas.width, (b - a) * scale, 0, 0, pc.width, (b - a) * scale);
    pdf.addImage(pc.toDataURL("image/jpeg", .92), "JPEG", M * k, M * k, CW * k, (b - a) * k);
    pdf.setFontSize(8); pdf.setTextColor(140); pdf.text(`${i + 1} / ${pages.length}`, (PW - M) * k, (PH - 34) * k, { align: "right" });
  });
  return pdf.output("blob");
}

async function sketchImages(it) {
  const layers = normLayers(it);
  let bgImg = null;
  if (it.bg) { const b = await fetchAsset(it.bg); if (b) bgImg = await createImageBitmap(b).catch(() => null); }
  const mk = () => { const cv = document.createElement("canvas"); cv.width = W; cv.height = H; return cv; };
  const full = mk(), c = full.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, W, H);
  if (bgImg) { c.globalCompositeOperation = "multiply"; c.drawImage(bgImg, 0, 0, W, H); c.globalCompositeOperation = "source-over"; }
  layers.forEach(l => { if (l.vis) l.strokes.forEach(st => drawStroke(c, st, l.op)); });
  const out = { full: await toBlob(full), layers: [] };
  const used = layers.filter(l => l.strokes.length);
  if (used.length + (bgImg ? 1 : 0) > 1) {
    if (bgImg) { const cv = mk(); cv.getContext("2d").drawImage(bgImg, 0, 0, W, H); out.layers.push({ name: "00 Birleştirilmiş taban", blob: await toBlob(cv) }); }
    for (let i = 0; i < layers.length; i++) {
      const l = layers[i]; if (!l.strokes.length) continue;
      const cv = mk(), g = cv.getContext("2d"); l.strokes.forEach(st => drawStroke(g, st, l.op));
      out.layers.push({ name: `${String(i + 1).padStart(2, "0")} ${l.name}`, blob: await toBlob(cv) });
    }
  }
  return out;
}

async function addProjectToZip(zip, p, topUsed) {
  const items = await getItems(p.id);
  const root = zip.folder(uniqName(topUsed, safeName(p.name || "Proje")));
  prog(`${p.name}: proje bilgisi`);
  root.file("Proje bilgisi.pdf", await htmlToPdf(p.name || "Proje", projectInfoBody(p), "Proje bilgisi"));
  prog(`${p.name}: tasarım süreci (PDF)`);
  root.file("Tasarım süreci.pdf", await htmlToPdf(`${p.name || "Proje"} · Tasarım süreci`, processBody(p, items), [p.course, "Şu anki aşama: " + stageName(curStage(p))].filter(Boolean).join(" · ")));
  if (((p.matrix || {}).con || []).length) { prog(`${p.name}: konsept matrisi (PDF)`); root.file("Konsept matrisi.pdf", await htmlToPdf(`${p.name || "Proje"} · Konsept matrisi`, matrixBody(p), p.course || "Konsept karşılaştırma")); }
  const sk = items.filter(i => i.kind === "sketch").sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (sk.length) {
    const f = root.folder("Eskizler"), used = new Set();
    for (let i = 0; i < sk.length; i++) {
      const s = sk[i]; prog(`${p.name}: eskiz ${i + 1}/${sk.length}`);
      const base = uniqName(used, safeName(s.title || "Eskiz")); const out = await sketchImages(s);
      f.file(base + ".png", out.full);
      if (out.layers.length) { const lf = f.folder(base + " - katmanlar"); out.layers.forEach(l => lf.file(safeName(l.name) + ".png", l.blob)); }
    }
  }
  const notes = items.filter(i => i.kind === "note");
  if (notes.length) {
    const f = root.folder("Araştırma"), used = new Set();
    for (let i = 0; i < notes.length; i++) { prog(`${p.name}: belge ${i + 1}/${notes.length} (PDF)`); f.file(uniqName(used, safeName(notes[i].title || "Belge"), ".pdf"), await notePdf(notes[i], p)); }
  }
  const imgs = items.filter(i => i.kind === "image").sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (imgs.length) {
    const f = root.folder("Pano"), used = new Set();
    for (let i = 0; i < imgs.length; i++) { prog(`${p.name}: görsel ${i + 1}/${imgs.length}`); const b = await fetchAsset(imgs[i].asset); if (!b) continue; f.file(uniqName(used, safeName(imgs[i].caption || `Görsel ${String(i + 1).padStart(2, "0")}`), extOf(b)), b); }
  }
  const crits = items.filter(i => i.kind === "crit");
  if (crits.length) { prog(`${p.name}: kritikler (PDF)`); root.folder("Kritikler").file("Tüm kritikler.pdf", await htmlToPdf(`${p.name} · Kritikler`, critsBody(crits), p.course || "Kritikler")); }
}
async function exportZip(projects, filename) {
  if (PROG.busy) return; if (!projects.length) { toast("İndirilecek proje yok."); return; }
  PROG.busy = true; prog("Hazırlanıyor…");
  try {
    if (NOTE.dirty) await saveNote.flush();
    await loadScript(CDN.zip);
    const zip = new window.JSZip(), top = new Set();
    for (const p of projects) await addProjectToZip(zip, p, top);
    prog("Paketleniyor…");
    const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
    prog(); await saveFile(filename, blob);
  } catch (e) { prog(); toast("İndirme hazırlanamadı: " + (e.message || "bilinmeyen hata")); }
  finally { PROG.busy = false; }
}

async function backupLoad(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || j.app !== "studyo-defteri") { toast("Bu bir Stüdyo Defteri yedeği değil."); return; }
    let n = 0; for (const id in j.assets || {}) if (!(id in LocalAssets._map)) { LocalAssets.put(id, j.assets[id]); n++; }
    const m = LocalDB.merge({ docs: j.docs, dead: j.dead });

    else toast("Yedekte buradakinden yeni bir şey yok.");
  } catch { toast("Yedek dosyası okunamadı."); }
}

/* =====================================================================
   PRACTICE — daily line / ellipse drills with automatic scoring
   ===================================================================== */

  ell: { name: "Elips", rounds: 10, desc: "Eksenleri ve açısı verilen elipsi tek hamlede çiz. Açılım 15°–60° arası değişir." },
  quad: { name: "Perspektifte daire", rounds: 8, desc: "Perspektifteki karenin kenarlarına teğet elips çiz. Silindirlerin temeli bu." },

const PRAC = { sessions: [], unsub: null, loaded: false };
const pracCol = () => DB.collection("data/users/" + UID + "/_practice/sessions");
function subscribePractice() {
  if (PRAC.unsub) return;
  PRAC.unsub = pracCol().onSnapshot(snap => {
    PRAC.sessions = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    PRAC.loaded = true; if (S.route.view === "practice" && !PR) renderPracticeBody();

}

  const days = new Set(PRAC.sessions.map(s => s.date)); let n = 0; const d = new Date();
  if (!days.has(todayISO())) d.setDate(d.getDate() - 1);
  for (;;) { const iso = new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); if (!days.has(iso)) break; n++; d.setDate(d.getDate() - 1); }
  return n;
}
function sparkSVG(list) {
  const pts = list.slice(-20); if (!pts.length) return `<div class="spark-empty">Henüz oturum yok</div>`;
  const Wd = 260, Ht = 64, pad = 6, n = pts.length;
  const x = i => n === 1 ? Wd / 2 : pad + i * (Wd - 2 * pad) / (n - 1), y = v => Ht - pad - (v / 100) * (Ht - 2 * pad);
  const line = pts.map((s, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(s.score).toFixed(1)}`).join("");
  const area = `${line}L${x(n - 1).toFixed(1)},${Ht - pad}L${x(0).toFixed(1)},${Ht - pad}Z`;
  const last = pts[n - 1];
  return `<svg class="spark" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="Son ${n} oturumun puanları, 0–100">
    <line x1="${pad}" x2="${Wd - pad}" y1="${y(50)}" y2="${y(50)}" class="sp-grid"/>
    <path d="${area}" class="sp-area"/><path d="${line}" class="sp-line"/>
    <circle cx="${x(n - 1)}" cy="${y(last.score)}" r="4.5" class="sp-end"/>
    ${pts.map((s, i) => `<circle cx="${x(i)}" cy="${y(s.score)}" r="9" class="sp-hit"><title>${esc(fmtLong(s.date))}: ${s.score} puan</title></circle>`).join("")}
  </svg>`;
}

      <div class="ex-top"><div><h3>${e.name}</h3><p>${e.desc}</p></div><span class="pill">${e.rounds} tur</span></div>
      <dl class="tblock ex-stats"><div><dt>Son</dt><dd>${last ? last.score : "—"}</dd></div><div><dt>En iyi</dt><dd>${ss.length ? best : "—"}</dd></div><div><dt>7 gün ort.</dt><dd>${avg ?? "—"}</dd></div><div><dt>Oturum</dt><dd>${ss.length}</dd></div></dl>
      <div class="ex-chart"><span class="eyebrow">Gelişim · puan 0–100</span>${sparkSVG(ss)}</div>
      <button class="btn primary" data-act="prac-start" data-ex="${k}">Başla</button>
    </article>`;
  }).join("")}</div>`;
}

let PR = null;
class Practice {
  constructor(ex) {
    this.ex = ex; this.def = EX[ex]; this.round = 0; this.scores = []; this.t0 = Date.now(); this.cur = null; this.phase = "draw";
    const el = document.createElement("div"); el.className = "skx pr"; el.innerHTML = `
      <div class="skx-bar"><button class="btn sm ghost" data-p="close">${ICON.back}<span class="hide-sm">Bitir</span></button>
        <b class="pr-title">${this.def.name}</b><span class="pr-round mono" id="prRound"></span><span class="pr-avg mono" id="prAvg"></span></div>
      <div class="skx-stage" id="prStage"><canvas id="prCv"></canvas><div class="pr-hint" id="prHint"></div><div class="pr-score" id="prScore" hidden></div></div>`;
    document.body.appendChild(el); this.el = el; document.body.style.overflow = "hidden";
    this.stage = $("#prStage", el); this.cv = $("#prCv", el); this.c = this.cv.getContext("2d");
    el.addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (!b) return; const a = b.dataset.p; if (a === "close") this.close(); if (a === "again") { this.close(); startPractice(this.ex); } });
    const cv = this.cv; cv.style.touchAction = "none";
    cv.addEventListener("pointerdown", e => this.down(e)); cv.addEventListener("pointermove", e => this.move(e));
    cv.addEventListener("pointerup", e => this.up(e)); cv.addEventListener("pointercancel", () => { this.cur = null; this.draw(); });
    this.ro = new ResizeObserver(() => { const wasZero = !this.t; this.resize(); if (!this.w) return; if (wasZero) this.next(); else this.draw(); }); this.ro.observe(this.stage);
    this.resize(); if (this.w) this.next();
  }
  resize() { const r = this.stage.getBoundingClientRect(); this.dpr = Math.min(devicePixelRatio || 1, 2.5); this.w = r.width; this.h = r.height; this.cv.width = r.width * this.dpr; this.cv.height = r.height * this.dpr; }
  rnd(a, b) { return a + Math.random() * (b - a); }
  next() {
    if (this.round >= this.def.rounds) { this.finish(); return; }
    this.round++; this.phase = "draw"; this.cur = null; $("#prScore", this.el).hidden = true;
    const w = this.w, h = this.h, m = Math.min(w, h), safe = 70;
    if (this.ex === "line") {
      const len = this.rnd(.32, .7) * m, ang = this.rnd(0, Math.PI);
      const cx = this.rnd(safe + len / 2 * Math.abs(Math.cos(ang)), w - safe - len / 2 * Math.abs(Math.cos(ang))), cy = this.rnd(safe + len / 2 * Math.abs(Math.sin(ang)), h - safe - 40 - len / 2 * Math.abs(Math.sin(ang)));
      this.t = { A: { x: cx - Math.cos(ang) * len / 2, y: cy - Math.sin(ang) * len / 2 }, B: { x: cx + Math.cos(ang) * len / 2, y: cy + Math.sin(ang) * len / 2 }, len };
    } else if (this.ex === "ell") {
      const rx = this.rnd(.17, .3) * m, deg = [15, 30, 45, 60][Math.floor(Math.random() * 4)], rot = this.rnd(-.6, .6) + (Math.random() < .3 ? Math.PI / 2 : 0);
      const c = { x: w / 2 + this.rnd(-.12, .12) * w, y: h / 2 + this.rnd(-.08, .08) * h - 10 };
      const ry = rx * Math.sin(deg * Math.PI / 180);
      this.t = { c, rx, ry, rot, deg, poly: Array.from({ length: 161 }, (_, i) => { const a = i / 160 * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry; return { x: c.x + x * Math.cos(rot) - y * Math.sin(rot), y: c.y + x * Math.sin(rot) + y * Math.cos(rot) }; }), norm: rx };
    } else {
      const s = this.rnd(.22, .34) * m, k = this.rnd(.5, .85), sq = this.rnd(.42, .7), sk = this.rnd(-.35, .35), rot = this.rnd(-.25, .25);
      const c = { x: w / 2 + this.rnd(-.1, .1) * w, y: h / 2 - 10 };
      const raw = [{ x: -1, y: 1 }, { x: 1, y: 1 }, { x: k + sk, y: -1 }, { x: -k + sk, y: -1 }].map(p => ({ x: p.x * s, y: p.y * s * sq }));
      const q = raw.map(p => ({ x: c.x + p.x * Math.cos(rot) - p.y * Math.sin(rot), y: c.y + p.x * Math.sin(rot) + p.y * Math.cos(rot) }));
      const area = Math.abs(q.reduce((a, p, i) => { const n = q[(i + 1) % 4]; return a + p.x * n.y - n.x * p.y; }, 0)) / 2;
      this.t = { q, poly: quadCircle(q, 160), norm: Math.sqrt(area) / 2 };
    }
    $("#prRound", this.el).textContent = `${this.round} / ${this.def.rounds}`;
    $("#prAvg", this.el).textContent = this.scores.length ? `ort. ${Math.round(this.scores.reduce((a, b) => a + b, 0) / this.scores.length)}` : "";
    $("#prHint", this.el).textContent = this.round === 1 ? "Önce eli havada gezdir (ghosting), sonra tek hamlede çiz." : this.ex === "line" ? "Noktadan noktaya tek hamle." : this.ex === "ell" ? `${this.t.deg}° elips · eksenlere oturt` : "Dört kenara da teğet olsun · köşegenler merkezi gösterir";

  }
  draw(fb) {
    if (!this.t) return;
    const c = this.c, d = this.dpr; c.setTransform(d, 0, 0, d, 0, 0); c.fillStyle = "#fff"; c.fillRect(0, 0, this.w, this.h);
    c.lineCap = "round"; c.lineJoin = "round"; const t = this.t;
    if (this.ex === "line") {
      c.fillStyle = "#1b1f21"; [t.A, t.B].forEach(p => { c.beginPath(); c.arc(p.x, p.y, 7, 0, Math.PI * 2); c.fill(); });
      c.strokeStyle = "rgba(27,31,33,.25)"; c.lineWidth = 1.5; [t.A, t.B].forEach(p => { c.beginPath(); c.arc(p.x, p.y, 16, 0, Math.PI * 2); c.stroke(); });
    } else if (this.ex === "ell") {
      const ux = Math.cos(t.rot), uy = Math.sin(t.rot);
      c.strokeStyle = "rgba(43,99,198,.55)"; c.lineWidth = 1.5; c.setLineDash([8, 7]);
      c.beginPath(); c.moveTo(t.c.x - ux * (t.rx + 30), t.c.y - uy * (t.rx + 30)); c.lineTo(t.c.x + ux * (t.rx + 30), t.c.y + uy * (t.rx + 30)); c.stroke();
      c.beginPath(); c.moveTo(t.c.x + uy * (t.ry + 24), t.c.y - ux * (t.ry + 24)); c.lineTo(t.c.x - uy * (t.ry + 24), t.c.y + ux * (t.ry + 24)); c.stroke(); c.setLineDash([]);
      c.strokeStyle = "rgba(43,99,198,.9)"; c.lineWidth = 2.5;

      [[uy * t.ry, -ux * t.ry], [-uy * t.ry, ux * t.ry]].forEach(([x, y]) => { c.beginPath(); c.moveTo(t.c.x + x - ux * 9, t.c.y + y - uy * 9); c.lineTo(t.c.x + x + ux * 9, t.c.y + y + uy * 9); c.stroke(); });
    } else {
      c.strokeStyle = "rgba(27,31,33,.85)"; c.lineWidth = 2; polyPath(c, t.q, true); c.stroke();
      c.strokeStyle = "rgba(43,99,198,.35)"; c.lineWidth = 1.2; c.setLineDash([6, 6]); seg(c, t.q[0], t.q[2]); seg(c, t.q[1], t.q[3]); c.setLineDash([]);
    }
    if (fb) { c.strokeStyle = "rgba(224,83,12,.85)"; c.lineWidth = 3; if (this.ex === "line") { c.beginPath(); c.moveTo(t.A.x, t.A.y); c.lineTo(t.B.x, t.B.y); c.stroke(); } else { polyPath(c, t.poly, true); c.stroke(); } }
    const p = this.cur || this.last; if (p && p.length) { c.strokeStyle = "#1b1f21"; c.lineWidth = 2.6; c.beginPath(); p.forEach((q, i) => i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)); c.stroke(); }
  }
  pt(e) { const r = this.cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  down(e) {
    if (this.phase !== "draw") { if (this.phase === "fb") { clearTimeout(this.tm); this.next(); } return; }
    if (e.pointerType === "pen" && !SKPREF.sawPen) { SKPREF.sawPen = true; SKPREF.penOnly = true; lsSet("sd-skpref", SKPREF); }
    if (e.pointerType === "touch" && SKPREF.penOnly) return;
    e.preventDefault(); try { this.cv.setPointerCapture(e.pointerId); } catch {}

  }
  move(e) {
    if (!this.cur || e.pointerId !== this.pid) return;

    this.draw();
  }
  up(e) {
    if (!this.cur || e.pointerId !== this.pid) return;
    const pts = this.cur; this.cur = null; this.last = pts;
    if (pts.length < 4) { this.last = null; this.draw(); return; }
    const { score, tip } = this.score(pts); this.scores.push(score); this.phase = "fb";
    this.draw(true);
    const sc = $("#prScore", this.el); sc.hidden = false; sc.innerHTML = `<b>${score}</b><span>${tip}</span>`;
    sc.className = "pr-score " + (score >= 80 ? "good" : score >= 55 ? "mid" : "low");
    this.tm = setTimeout(() => this.next(), 1500);
  }
  score(pts) {
    const t = this.t, clamp = v => Math.max(0, Math.min(100, Math.round(v)));
    if (this.ex === "line") {
      const a = pts[0], b = pts[pts.length - 1], L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      let dev = 0; for (const p of pts) dev = Math.max(dev, Math.abs((b.x - a.x) * (a.y - p.y) - (a.x - p.x) * (b.y - a.y)) / L);
      const rel = dev / L, end = Math.min(Math.hypot(a.x - t.A.x, a.y - t.A.y) + Math.hypot(b.x - t.B.x, b.y - t.B.y), Math.hypot(a.x - t.B.x, a.y - t.B.y) + Math.hypot(b.x - t.A.x, b.y - t.A.y)) / 2;
      const s = clamp(100 - rel * 700 - Math.max(0, end - 4) * .7);
      return { score: s, tip: rel > .035 ? "Çizgi bombeli; omuzdan ve biraz daha hızlı çek." : end > 18 ? "Hedef noktaya varmadı; önce ghosting yap." : s >= 85 ? "Çok iyi, kararlı bir çizgi!" : "İyi; uç noktalara biraz daha dikkat." };

  }
  async finish() {
    this.phase = "done";
    const avg = Math.round(this.scores.reduce((a, b) => a + b, 0) / this.scores.length), best = Math.max(...this.scores);
    const prev = PRAC.sessions.filter(s => s.ex === this.ex).slice(-1)[0];
    const sc = $("#prScore", this.el); sc.hidden = false; sc.className = "pr-score pr-done";
    sc.innerHTML = `<span class="eyebrow">Oturum bitti</span><b>${avg}</b><span>ortalama puan · en iyi tur ${best}${prev ? ` · önceki oturum ${prev.score}` : ""}</span>
      <div class="pr-btns"><button class="btn primary" data-p="again">Tekrar</button><button class="btn" data-p="close">Kapat</button></div>`;
    $("#prHint", this.el).textContent = "";
    try { await pracCol().doc(rid()).set({ ex: this.ex, score: avg, rounds: this.scores, date: todayISO(), durationMs: Date.now() - this.t0, createdAt: now() }); }
    catch { toast("Oturum kaydedilemedi."); }
  }
  close() { clearTimeout(this.tm); this.ro.disconnect(); this.el.remove(); document.body.style.overflow = ""; PR = null; if (S.route.view === "practice") renderPracticeBody(); }
}
function startPractice(ex) { if (PR) return; PR = new Practice(ex); }
